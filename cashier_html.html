<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Касса Кайдзен</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6fa;color:#172033}header{background:linear-gradient(135deg,#11643e,#155fa0);color:white;padding:22px}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:white;border-radius:15px;padding:20px;margin:18px 0;box-shadow:0 4px 18px #20304012}.login{max-width:430px;margin:60px auto}.hidden{display:none}input,button{width:100%;padding:12px;border:1px solid #ccd6e2;border-radius:9px;font-size:15px;margin:6px 0}button{border:0;background:#11643e;color:white;font-weight:bold;cursor:pointer}.secondary{background:#e8eef4;color:#172033}.row{display:flex;justify-content:space-between;border-bottom:1px solid #e5e9ef;padding:10px 0}.amount{text-align:center;font-size:32px;font-weight:bold;color:#11643e;margin:20px}.ok{background:#e0f6e9;padding:12px;border-radius:9px}.err{background:#fee4e2;padding:12px;border-radius:9px}.warn{background:#fff4cc;padding:12px;border-radius:9px}</style></head><body><header><div class="wrap"><h1>💵 Касса Кайдзен / Кайдзен кассасы</h1></div></header><div class="wrap"><div id="login" class="card login"><h2>Вход кассира</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card"><div id="who"></div><button id="logout" class="secondary">Выйти</button></div><div class="card"><h2>🎫 Проверить билет</h2><input id="ticket" placeholder="Номер билета"><button id="findBtn">Найти билет</button><div id="msg"></div></div><div id="ticketCard" class="card hidden"></div></div></div><script>
const URL="https://mycscylkxnnrvpesqefo.supabase.co",KEY="sb_publishable_fCXgI-ntOOnJD269S7m5Mw_oRef7pPi",sb=supabase.createClient(URL,KEY),$=x=>document.getElementById(x);let current=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=v=>Number(v||0).toLocaleString("ru-RU")+" ₸";
async function enter(u){
 $("loginMsg").innerHTML='<div class="ok">✅ Авторизация успешна. Проверяю роль кассира...</div>';
 const {data,error}=await sb.from("profiles").select("role").eq("id",u.id).maybeSingle();
 if(error) throw Error("Ошибка проверки роли: "+error.message);
 if(!data) throw Error("Профиль пользователя не найден.");
 if(data.role!=="cashier") throw Error("Роль пользователя: "+data.role+". Требуется cashier.");
 $("who").innerHTML="<b>"+esc(u.email)+" • CASHIER</b><br>✅ База подключена";
 $("login").classList.add("hidden");$("app").classList.remove("hidden");
}
$("loginBtn").onclick=async()=>{
 const btn=$("loginBtn"); btn.disabled=true; btn.textContent="Вход...";
 $("loginMsg").innerHTML='<div class="warn">Подключаюсь к Supabase...</div>';
 try{
   const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
   if(error) throw Error("Ошибка авторизации: "+error.message);
   if(!data.session||!data.user) throw Error("Supabase не вернул активную сессию.");
   await sb.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});
   await enter(data.user);
 }catch(e){
   $("loginMsg").innerHTML='<div class="err">'+esc(e.message)+'</div>';
 }finally{btn.disabled=false;btn.textContent="Войти"}
};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
async function findTicket(){let t=$("ticket").value.trim().toUpperCase();const {data,error}=await sb.from("kaizen").select("*").eq("ticket_number",t).maybeSingle();if(error||!data){$("msg").innerHTML='<div class="err">'+esc(error?error.message:"Билет не найден")+'</div>';$("ticketCard").classList.add("hidden");return}current=data;$("msg").textContent="";$("ticketCard").classList.remove("hidden");let paid=data.payment_status==="Выплачено";$("ticketCard").innerHTML=`<h2>🎫 ${esc(data.ticket_number)}</h2><div class="${paid?"warn":"ok"}"><b>${esc(data.payment_status)}</b></div><div class="row"><span>Кайдзен</span><b>${esc(data.kaizen_number)}</b></div><div class="row"><span>Сотрудник</span><b>${esc(data.employee_name)}</b></div><div class="row"><span>Участок</span><b>${esc(data.area)}</b></div><div class="row"><span>Идея</span><b>${money(data.reward_idea)}</b></div><div class="row"><span>Внедрение</span><b>${money(data.reward_implementation)}</b></div><div class="row"><span>Участие</span><b>${money(data.reward_participation)}</b></div><div class="amount">${money(data.total_reward)}</div>${data.payment_status==="К выплате"?'<button id="payBtn">✅ Подтвердить выплату</button>':'<div class="warn"><b>Повторная выплата запрещена.</b></div>'}`;if($("payBtn"))$("payBtn").onclick=pay}
$("findBtn").onclick=findTicket;
async function pay(){if(!confirm("Подтвердить выплату "+money(current.total_reward)+"?"))return;const {error}=await sb.rpc("pay_kaizen_ticket",{p_ticket_number:current.ticket_number});if(error){alert(error.message);await findTicket();return}alert("Выплата подтверждена. Повторная выплата заблокирована.");await findTicket()}
(async()=>{const {data}=await sb.auth.getSession();if(data.session)try{await enter(data.session.user)}catch(e){await sb.auth.signOut()}})();
</script></body></html>
