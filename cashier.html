<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Касса Кайдзен</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#10233f}header{background:linear-gradient(135deg,#11643e,#155fa0);color:#fff;padding:24px}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #20304012}.login{max-width:460px;margin:55px auto}.hidden{display:none}input,button{font:inherit;padding:12px;border-radius:9px}input{width:100%;border:1px solid #ccd6e2;margin:6px 0 10px}button{border:0;background:#116b43;color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#e8eef4;color:#172033}.err{background:#fee4e2;color:#9f1d16;padding:12px;border-radius:9px;margin-top:10px}.ok{background:#e0f6e9;color:#11643e;padding:12px;border-radius:9px;margin-top:10px}.muted{color:#667085}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ticket{border:1px solid #d8e0e8;border-radius:12px;padding:16px;margin-top:14px}.big{font-size:22px;font-weight:bold}table{width:100%;border-collapse:collapse}td{padding:7px;border-bottom:1px solid #edf0f3}@media(max-width:600px){header{padding:18px}.wrap{padding:12px}}</style></head>
<body><header><div class="wrap" style="padding:0"><h1>💵 Касса Кайдзен / Кайдзен кассасы</h1></div></header><div class="wrap">
<section id="login" class="card login"><h2>Вход кассира</h2><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="loginBtn" style="width:100%">Войти</button><div id="loginMsg"></div></section>
<main id="app" class="hidden"><div class="card row" style="justify-content:space-between"><div><b id="who"></b><div class="muted">База подключена • роль CASHIER</div></div><button id="logout" class="secondary">Выйти</button></div><div class="card"><h2>🎫 Проверка билета</h2><div class="row"><input id="ticket" placeholder="Например: T-2026-UIQR0Z" style="flex:1;margin:0"><button id="findBtn">Найти билет</button></div><div id="msg"></div><div id="result"></div></div></main></div>
<script>
const SUPABASE_URL="https://mycscylkxnnrvpesqefo.supabase.co",SUPABASE_KEY="sb_publishable_fCXgI-ntOOnJD269S7m5Mw_oRef7pPi";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=v=>Number(v||0).toLocaleString("ru-RU")+" ₸";let current=null;
async function enter(user){$("loginMsg").innerHTML='<div class="ok">Авторизация успешна. Проверяю роль кассира…</div>';const {data,error}=await sb.from("profiles").select("role").eq("id",user.id).maybeSingle();if(error)throw new Error("Ошибка проверки роли: "+error.message);if(!data)throw new Error("Профиль пользователя не найден.");if(data.role!=="cashier")throw new Error("Требуется роль cashier.");$("who").textContent=user.email+" • CASHIER";$("login").classList.add("hidden");$("app").classList.remove("hidden");const t=new URLSearchParams(location.search).get("ticket");if(t){$("ticket").value=t.toUpperCase();await findTicket()}}
$("loginBtn").addEventListener("click",async()=>{const btn=$("loginBtn");btn.disabled=true;btn.textContent="Вход…";try{const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw new Error("Ошибка авторизации: "+error.message);await enter(data.user)}catch(e){$("loginMsg").innerHTML='<div class="err">'+esc(e.message)+'</div>'}finally{btn.disabled=false;btn.textContent="Войти"}});
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});
async function findTicket(){current=null;$("result").innerHTML="";$("msg").innerHTML="";const t=$("ticket").value.trim().toUpperCase();if(!t){$("msg").innerHTML='<div class="err">Введите номер билета.</div>';return}const {data,error}=await sb.from("kaizen").select("kaizen_number,employee_name,ticket_number,total_reward,payment_status,paid_at,status,reward_idea,reward_implementation,reward_participation").eq("ticket_number",t).maybeSingle();if(error){$("msg").innerHTML='<div class="err">'+esc(error.message)+'</div>';return}if(!data){$("msg").innerHTML='<div class="err">Билет не найден.</div>';return}current=data;const paid=data.payment_status==="Выплачено";$("result").innerHTML=`<div class="ticket"><div class="big">${esc(data.ticket_number)}</div><table><tr><td>Кайдзен</td><td>${esc(data.kaizen_number)}</td></tr><tr><td>Сотрудник</td><td>${esc(data.employee_name)}</td></tr><tr><td>За идею</td><td>${money(data.reward_idea)}</td></tr><tr><td>За внедрение</td><td>${money(data.reward_implementation)}</td></tr><tr><td>За участие</td><td>${money(data.reward_participation)}</td></tr><tr><td><b>Итого</b></td><td><b>${money(data.total_reward)}</b></td></tr><tr><td>Статус оплаты</td><td><b>${esc(data.payment_status)}</b></td></tr></table>${paid?'<div class="ok">✅ Этот билет уже выплачен. Повторная выплата заблокирована.</div>':'<button id="payBtn" style="margin-top:14px">Подтвердить выплату '+money(data.total_reward)+'</button>'}</div>`;if(!paid)$("payBtn").addEventListener("click",payTicket)}
$("findBtn").addEventListener("click",findTicket);$("ticket").addEventListener("keydown",e=>{if(e.key==="Enter")findTicket()});
async function payTicket(){if(!current||!confirm("Подтвердить выплату "+money(current.total_reward)+"?"))return;const btn=$("payBtn");if(btn){btn.disabled=true;btn.textContent="Провожу выплату…"}const {error}=await sb.rpc("pay_kaizen_ticket",{p_ticket_number:current.ticket_number});if(error){$("msg").innerHTML='<div class="err">'+esc(error.message)+'</div>';if(btn)btn.disabled=false;return}await findTicket()}
(async()=>{try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)await enter(data.session.user)}catch(e){await sb.auth.signOut();$("loginMsg").innerHTML='<div class="err">'+esc(e.message)+'</div>'}})();
</script></body></html>
