<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Кайдзен — Кабинет администратора</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}
header{background:linear-gradient(135deg,#11643e,#155fa0);color:#fff;padding:18px 22px}
.wrap{max-width:1250px;margin:auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 4px 18px #20304012}
h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
input,select,button{font:inherit;padding:11px;border:1px solid #ccd6e2;border-radius:9px}
button{border:0;background:#11643e;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#e8eef4;color:#172033}.danger{background:#b42318}.ok{background:#087443}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e5e9ef;padding:10px;text-align:left;vertical-align:top}th{background:#f5f7fa}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eef2f6}.wait{background:#fff4cc}.approved{background:#dff6e8}.rejected{background:#fee4e2}
.login{max-width:430px;margin:70px auto}.hidden{display:none}.muted{color:#667085}.actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px;display:block;overflow:auto;white-space:nowrap}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🧑‍💼 Кабинет администратора / Әкімші кабинеті</h1><div>AI Кайдзен • Единая база предприятия</div></div></header>

<div id="login" class="card login">
<h2>Вход администратора</h2>
<p class="muted">Используйте email и пароль пользователя, которому назначена роль admin.</p>
<input id="email" type="email" placeholder="Email" style="width:100%;margin-bottom:10px">
<input id="password" type="password" placeholder="Пароль" style="width:100%;margin-bottom:10px">
<button id="loginBtn" style="width:100%">Войти</button>
<div id="loginMsg" class="muted" style="margin-top:12px"></div>
</div>

<main id="app" class="wrap hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
<div><b id="who"></b><div id="status" class="muted">Загрузка...</div></div>
<button id="logout" class="secondary">Выйти</button>
</div>
</div>

<div class="card">
<h2>📊 Заявки Кайдзен</h2>
<div class="grid">
<input id="search" placeholder="Поиск: номер, ФИО, участок">
<select id="filterStatus"><option value="">Все статусы</option><option>На рассмотрении</option><option>Одобрено</option><option>Отклонено</option></select>
<button id="refresh">Обновить</button>
<div id="count" class="muted" style="padding:11px 0"></div>
</div>
</div>

<div class="card">
<div style="overflow:auto">
<table>
<thead><tr>
<th>Номер / дата</th><th>Сотрудник</th><th>Участок</th><th>Проблема / идея</th><th>Статус</th><th>Вознаграждение</th><th>Действие</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</main>

<script>
const SUPABASE_URL="https://mycscylkxnnrvpesqefo.supabase.co";
const SUPABASE_KEY="sb_publishable_fCXgI-ntOOnJD269S7m5Mw_oRef7pPi";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let all=[];

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(v){return Number(v||0).toLocaleString("ru-RU")+" ₸"}
function ticket(){return "T-"+new Date().getFullYear()+"-"+Math.random().toString(36).slice(2,8).toUpperCase()}

async function checkRole(user){
 const {data,error}=await sb.from("profiles").select("role").eq("id",user.id).single();
 if(error||!data||data.role!=="admin") throw new Error("У пользователя нет роли admin.");
 $("who").textContent=user.email+" • ADMIN";
}

async function load(){
 $("status").textContent="Загрузка заявок...";
 const {data,error}=await sb.from("kaizen").select("*").order("created_at",{ascending:false});
 if(error){$("status").textContent="Ошибка: "+error.message;return}
 all=data||[]; render();
 $("status").textContent="База подключена";
}
function render(){
 const q=$("search").value.trim().toLowerCase(), fs=$("filterStatus").value;
 const data=all.filter(x=>(!fs||x.status===fs)&&(!q||[x.kaizen_number,x.employee_name,x.area,x.problem,x.idea].join(" ").toLowerCase().includes(q)));
 $("count").textContent="Показано: "+data.length+" из "+all.length;
 $("rows").innerHTML=data.map(x=>{
  const cls=x.status==="Одобрено"?"approved":x.status==="Отклонено"?"rejected":"wait";
  return `<tr>
  <td><b>${esc(x.kaizen_number)}</b><br><span class="muted">${new Date(x.created_at).toLocaleString("ru-RU")}</span>${x.ticket_number?`<br>🎫 ${esc(x.ticket_number)}`:""}</td>
  <td><b>${esc(x.employee_name)}</b><br>${esc(x.employee_id||"")}<br>${esc(x.phone||"")}</td>
  <td>${esc(x.area)}<br>${esc(x.category||"")}</td>
  <td><b>Проблема:</b> ${esc(x.problem)}<br><b>Идея:</b> ${esc(x.idea)}<br><b>Эффект:</b> ${esc(x.expected_effect)}</td>
  <td><span class="badge ${cls}">${esc(x.status)}</span><br>${esc(x.payment_status||"")}</td>
  <td>Идея: ${money(x.reward_idea)}<br>Внедрение: ${money(x.reward_implementation)}<br>Участие: ${money(x.reward_participation)}<br><b>Итого: ${money(x.total_reward)}</b></td>
  <td><div class="actions">
    ${x.status!=="Одобрено"?`<button onclick="approve('${x.id}')">Одобрить</button>`:""}
    ${x.status!=="Отклонено"?`<button class="danger" onclick="rejectIdea('${x.id}')">Отклонить</button>`:""}
    ${x.status==="Одобрено"&&!x.ticket_number?`<button class="secondary" onclick="makeTicket('${x.id}')">🎫 Билет</button>`:""}
  </div></td>
  </tr>`
 }).join("")||`<tr><td colspan="7">Заявок нет</td></tr>`;
}
async function approve(id){
 const idea=all.find(x=>x.id===id);
 if(!idea)return;
 const r1=prompt("Награда за идею, ₸","1000"); if(r1===null)return;
 const r2=prompt("Награда за внедрение, ₸","10000"); if(r2===null)return;
 const r3=prompt("Награда за участие, ₸","2000"); if(r3===null)return;
 const {error}=await sb.from("kaizen").update({
  status:"Одобрено",reward_idea:Number(r1)||0,reward_implementation:Number(r2)||0,
  reward_participation:Number(r3)||0,payment_status:"Не назначено",approved_at:new Date().toISOString()
 }).eq("id",id);
 if(error)alert("Ошибка: "+error.message);else await load();
}
async function rejectIdea(id){
 if(!confirm("Отклонить эту заявку?"))return;
 const {error}=await sb.from("kaizen").update({status:"Отклонено"}).eq("id",id);
 if(error)alert("Ошибка: "+error.message);else await load();
}
async function makeTicket(id){
 const t=ticket();
 const {error}=await sb.from("kaizen").update({ticket_number:t,payment_status:"К выплате"}).eq("id",id).is("ticket_number",null);
 if(error){alert("Не удалось создать билет: "+error.message);return}
 alert("Билет создан: "+t+"\nСтатус: К выплате");
 await load();
}
$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="Вход...";
 const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error){$("loginMsg").textContent="Ошибка входа: "+error.message;return}
 try{await checkRole(data.user);$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}
 catch(e){await sb.auth.signOut();$("loginMsg").textContent=e.message}
};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("refresh").onclick=load;$("search").oninput=render;$("filterStatus").onchange=render;
(async()=>{
 const {data}=await sb.auth.getSession();
 if(data.session){try{await checkRole(data.session.user);$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}catch(e){await sb.auth.signOut()}}
})();
</script>
</body></html>
