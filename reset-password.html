<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Кайдзен — Новый пароль</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}
header{background:linear-gradient(135deg,#11643e,#155fa0);color:#fff;padding:22px}
.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:24px;margin-top:55px;box-shadow:0 4px 18px #20304012}
input,button{width:100%;padding:13px;border-radius:9px;font-size:15px;margin:7px 0}
input{border:1px solid #ccd6e2}button{border:0;background:#11643e;color:#fff;font-weight:bold;cursor:pointer}
.msg{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#e0f6e9}.err{background:#fee4e2}.muted{color:#667085}
</style>
</head>
<body>
<header><div class="wrap"><h1>🔐 Новый пароль / Жаңа құпиясөз</h1><div>AI Кайдзен</div></div></header>
<div class="wrap">
<div class="card">
<h2>Установить новый пароль</h2>
<p class="muted">Введите новый пароль для вашей учётной записи.</p>
<input id="p1" type="password" placeholder="Новый пароль">
<input id="p2" type="password" placeholder="Повторите новый пароль">
<button id="save">Сохранить пароль</button>
<div id="msg"></div>
</div></div>
<script>
const sb=supabase.createClient(
 "https://mycscylkxnnrvpesqefo.supabase.co",
 "sb_publishable_fCXgI-ntOOnJD269S7m5Mw_oRef7pPi"
);
const msg=document.getElementById("msg");
document.getElementById("save").onclick=async()=>{
 const p1=document.getElementById("p1").value,p2=document.getElementById("p2").value;
 if(p1.length<6){msg.className="msg err";msg.textContent="Пароль должен содержать минимум 6 символов.";return}
 if(p1!==p2){msg.className="msg err";msg.textContent="Пароли не совпадают.";return}
 msg.className="msg";msg.textContent="Сохраняем...";
 const {error}=await sb.auth.updateUser({password:p1});
 if(error){msg.className="msg err";msg.textContent="Ошибка: "+error.message;return}
 msg.className="msg ok";
 msg.innerHTML='✅ Пароль успешно изменён.<br><br><a href="cashier.html">Перейти в кабинет кассира</a>';
};
</script>
</body></html>
